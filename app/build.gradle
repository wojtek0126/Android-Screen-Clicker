plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.wojtek0126.screenclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.wojtek0126.screenclicker'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
